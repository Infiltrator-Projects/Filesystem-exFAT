name: Qualify Linux exFAT.so unified filesystem and defrag engine
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux-exfat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev libsqlite3-dev
      - name: Enforce one exFAT.so and source ownership
        run: python3 tests/ownership_boundary_test.py
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - name: Verify CMake installs only the canonical SO and freshly generated versioned PDF
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build/native
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -s "$stage/System/Filesystems/exFAT.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-exFAT.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-exFAT.pdf")" = '%PDF-'
          cmp build/native/Filesystem-exFAT.pdf "$stage/System/Resources/Documentation/Filesystem-exFAT.pdf"
      - run: |
          test -f build/native/exFAT.so
          nm -D --defined-only build/native/exFAT.so | grep -F infiltrator_filesystem_api_v2
          ! nm -D --defined-only build/native/exFAT.so | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
