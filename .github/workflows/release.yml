name: Qualify exFAT Common V2 hosted and freestanding binaries
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-exfat-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install independent image tools and build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev libsqlite3-dev exfatprogs dosfstools dpkg-dev
      - name: Build, exercise and checksum-check the hosted Common V2 engine
        run: |
          set -euo pipefail
          make test
          test -s build/unified/firmware/exFAT.so
          ! readelf -d build/unified/firmware/exFAT.so | grep '(NEEDED)'
      - name: Check actual production BOOT validator against carrier and firmware ELF
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Infiltrator-Projects/Boot.git "$RUNNER_TEMP/Boot"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            "$RUNNER_TEMP/Boot/boot/so_elf.c" \
            "$RUNNER_TEMP/Boot/packaging/validate-module.c" -o build/boot-validate-module
          build/boot-validate-module build/exFAT.so
          build/boot-validate-module build/unified/firmware/exFAT.so
      - name: Create portable DEB and source-embedded RUN without a kernel module
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          version=$(tr -d '\r\n' < VERSION)
          deb="dist/infiltrator-filesystem-exfat_${version}_amd64.deb"
          run="dist/filesystem-exfat-${version}-native-installer.run"
          test -s "$deb" && test -s "$run"
          mkdir -p build/package-root
          dpkg-deb -x "$deb" build/package-root
          test "$(find build/package-root -type f | wc -l)" -eq 2
          packaged=build/package-root/System/Filesystems/exFAT.so
          cmp "$packaged" build/exFAT.so
          build/boot-validate-module "$packaged"
          ! nm -D --defined-only "$packaged" | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
          ! find build/package-root -name '*.ko' | grep .
      - uses: actions/upload-artifact@v4
        with:
          name: exfat-v2-unreleased-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
# No publish job: BOOT's loader and complete OVMF kernel/initramfs handoff
# must pass using the packaged V2 binary before a new version is released.
# Native sources for historical exfat.ko tests remain in the repository,
# but kernel objects are neither packaged nor published as V2 substitutes.
