name: Qualify exFAT Common V2 hosted and freestanding binaries
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-exfat-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install independent image tools and build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev libsqlite3-dev exfatprogs dosfstools dpkg-dev
      - name: Build, exercise and checksum-check the hosted Common V2 engine
        run: |
          set -euo pipefail
          make test
          test -s build/unified/firmware/exFAT.so
          ! readelf -d build/unified/firmware/exFAT.so | grep '(NEEDED)'
      - name: Check actual production BOOT validator against carrier and firmware ELF
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Infiltrator-Projects/Boot.git "$RUNNER_TEMP/Boot"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            "$RUNNER_TEMP/Boot/boot/so_elf.c" \
            "$RUNNER_TEMP/Boot/packaging/validate-module.c" -o build/boot-validate-module
          build/boot-validate-module build/exFAT.so
          build/boot-validate-module build/unified/firmware/exFAT.so
      - name: Exercise BOOT's relocated Common V2 reader with real file data
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I"$RUNNER_TEMP/Boot/boot" -Iinclude \
            "$RUNNER_TEMP/Boot/boot/so_elf.c" tests/exfat_boot_v2_test.c \
            -o build/boot-read-test
          work="$RUNNER_TEMP/exfat-boot-fixture"
          mkdir -p "$work"
          truncate -s 128M "$work/exfat.img" "$work/fat32.img"
          mkfs.exfat -n BOOTV2 "$work/exfat.img"
          mkfs.fat -F 32 -I "$work/fat32.img"
          # Native V2 test writes disposable contents, then reformats to a
          # 4 KiB-sector real exFAT and writes deterministic /FOURK.BIN.
          build/exfat-realimage-test build/exFAT.so "$work/exfat.img" "$work/fat32.img"
          sha256sum "$work/exfat.img" > "$work/before.sha256"
          build/boot-read-test build/exFAT.so "$work/exfat.img"
          build/boot-read-test build/unified/firmware/exFAT.so "$work/exfat.img"
          # Corrupt a disposable COPY of the boot checksum sector, not source.
          cp "$work/exfat.img" "$work/corrupt.img"
          dd if=/dev/zero of="$work/corrupt.img" bs=4096 seek=11 count=1 \
             conv=notrunc status=none
          build/boot-read-test build/exFAT.so "$work/corrupt.img" --reject-corrupt
          build/boot-read-test build/unified/firmware/exFAT.so \
            "$work/corrupt.img" --reject-corrupt
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/exfat_mutate_geometry.c -o build/exfat-mutate-geometry
          cp "$work/exfat.img" "$work/bad-layout.img"
          build/exfat-mutate-geometry "$work/bad-layout.img"
          # A recalculated correct checksum may NOT hide invalid FAT geometry.
          build/boot-read-test build/exFAT.so "$work/bad-layout.img" --reject-corrupt
          build/boot-read-test build/unified/firmware/exFAT.so \
            "$work/bad-layout.img" --reject-corrupt
          (cd "$work" && sha256sum -c before.sha256)
      - name: Create portable DEB and source-embedded RUN without a kernel module
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          version=$(tr -d '\r\n' < VERSION)
          deb="dist/infiltrator-filesystem-exfat_${version}_amd64.deb"
          run="dist/filesystem-exfat-${version}-native-installer.run"
          test -s "$deb" && test -s "$run"
          mkdir -p build/package-root
          dpkg-deb -x "$deb" build/package-root
          test "$(find build/package-root -type f | wc -l)" -eq 2
          packaged=build/package-root/System/Filesystems/exFAT.so
          work="$RUNNER_TEMP/exfat-boot-fixture"
          # Portable and source-embedded builds intentionally use different
          # optimizations, so equality of their entire ELF bytes is NOT an ABI test.
          # Validate the exact binary that actually goes into the DEB.
          build/boot-validate-module "$packaged"
          readelf -S "$packaged" | grep -F '.infiltrator_boot'
          build/boot-read-test "$packaged" "$work/exfat.img"
          ! nm -D --defined-only "$packaged" | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
          # Full symbol table and dynamic dependencies must contain no V1
          # callbacks, worker entrypoint, POSIX-bound service trampoline, or
          # obsolete OpenSSL/SQLite dependency retained by legacy workers.
          ! nm -a "$packaged" | grep -E 'ifs_bind_services|ifs_unbind_services|ifs_exfat_worker_main|infiltrator_filesystem_.*_v1'
          ! readelf -d "$packaged" | grep -E 'libcrypto\.so|libsqlite3\.so'
          ! find build/package-root -name '*.ko' | grep .
      - name: Verify source-embedded native RUN and its exact filesystem package
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          native="$RUNNER_TEMP/exfat-native-v2"
          bash "dist/filesystem-exfat-$version-native-installer.run" \
            --profile aggressive --system-package-mode --build-only \
            --output "$native"
          deb="$native/infiltrator-filesystem-exfat_$version+native1_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" X-Infiltrator-Native-Profile)" = aggressive
          mkdir -p "$native/extracted"
          dpkg-deb -x "$deb" "$native/extracted"
          test "$(find "$native/extracted" -type f | wc -l)" -eq 2
          module="$native/extracted/System/Filesystems/exFAT.so"
          test -s "$module"
          build/boot-validate-module "$module"
          build/boot-read-test "$module" "$RUNNER_TEMP/exfat-boot-fixture/exfat.img"
          ! nm -D --defined-only "$module" | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
          ! find "$native/extracted" -name '*.ko' | grep .
          (cd "$RUNNER_TEMP/exfat-boot-fixture" && sha256sum -c before.sha256)
      - name: Qualify a real EFI-stub kernel and initramfs in OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio busybox-static gdisk mtools qemu-system-x86 ovmf
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude tests/exfat_boot_media_writer.c -ldl -o build/exfat-boot-media-writer
          stage="$RUNNER_TEMP/exfat-boot-vm"
          mkdir -p "$stage"
          boot=infiltrator-boot_0.1.69_amd64.deb
          curl -fsSL --retry 3 \
            "https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.69/$boot" \
            -o "$stage/$boot"
          printf '%s  %s\n' \
            73429727974a902372f7d2644d00bb1f527e42b4454f9f3cafbf8ef1ad6c9a8e \
            "$stage/$boot" | sha256sum -c -
          dpkg-deb -x "$stage/$boot" "$stage/boot-package"
          img=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ { image=$2 } END { print image }')
          test -n "$img"
          kernelver=$(printf '%s' "$img" | sed 's/^linux-image-//')
          (cd "$stage" && apt-get download "linux-image-unsigned-$kernelver")
          dpkg-deb -x "$stage"/linux-image-unsigned-*.deb "$stage/kernel"
          kernel="$stage/kernel/boot/vmlinuz-$kernelver"
          test -s "$kernel"
          bash tests/firmware-exfat.sh \
            "$stage/boot-package/usr/lib/infiltrator-boot/EFI/BOOT/BOOTX64.EFI" \
            "build/package-root/System/Filesystems/exFAT.so" \
            "$kernel" "$PWD/build/exfat-boot-media-writer" "$stage/vm"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exfat-ovmf-serial
          path: '**/serial.log'
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: exfat-v2-unreleased-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
# No publish job: BOOT's loader and complete OVMF kernel/initramfs handoff
# must pass using the packaged V2 binary before a new version is released.
# Native sources for historical exfat.ko tests remain in the repository,
# but kernel objects are neither packaged nor published as V2 substitutes.
