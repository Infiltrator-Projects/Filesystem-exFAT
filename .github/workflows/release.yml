name: Qualify and release exFAT.so plus pinned exfat.ko
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: filesystem-exfat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  exfat-so:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact canonical exFAT source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install compiler, packaging and independent media verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev libsqlite3-dev exfatprogs dosfstools dpkg-dev
      - name: Qualify the actual complete exFAT.so against independent exfatprogs
        run: |
          set -euo pipefail
          python3 tests/ownership_boundary_test.py
          make test
          [[ "$(cat VERSION)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s build/exFAT.so
          # Native Defrag/Recover requires the normal Linux runtime libraries.
          # The qualified module must export the entire shared-object contract.
          nm -D --defined-only build/exFAT.so | grep -F 'infiltrator_filesystem_api_v2'
          ! nm -D --defined-only build/exFAT.so | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
      - name: Build portable two-file Debian and source-embedded native RUN using Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          version=$(tr -d '\r\n' < VERSION)
          test -s "dist/infiltrator-filesystem-exfat_${version}_amd64.deb"
          test -s "dist/filesystem-exfat-${version}-native-installer.run"
          install -m 0644 build/exFAT.so dist/exFAT.so
          test "$(dpkg-deb -f dist/*.deb X-Infiltrator-Native-Profile)" = portable
          # Test the ACTUAL release payload, not just the developer build.
          # A prior immutable exFAT release exposed only the retired ABI
          # despite the new strict Common V2 source existing on main.
          stage="$RUNNER_TEMP/portable-v2-export"
          mkdir -p "$stage"
          dpkg-deb -x "dist/infiltrator-filesystem-exfat_${version}_amd64.deb" "$stage"
          packaged="$stage/System/Filesystems/exFAT.so"
          test -s "$packaged"
          nm -D --defined-only "$packaged" | grep -E ' [TW] infiltrator_filesystem_api_v2
      - name: Build, profile-train and verify portable native RUN (two-file payload)
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          # Python release.py already generated the source-embedded RUN above.
          bash "dist/filesystem-exfat-${version}-native-installer.run" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native-exfat"
          deb="$RUNNER_TEMP/native-exfat/infiltrator-filesystem-exfat_${version}+native1_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$deb" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$deb" X-Infiltrator-LTO)" = enabled
          test "$(dpkg-deb -f "$deb" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/native-payload"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/native-payload"
          test "$(find "$RUNNER_TEMP/native-payload" -type f | wc -l)" -eq 2
          test -s "$RUNNER_TEMP/native-payload/System/Filesystems/exFAT.so"
          # The tracked docs/exFAT.pdf is a legacy snapshot; compare the two
          # freshly generated PDFs from the same release source instead.
          mkdir -p "$RUNNER_TEMP/portable-payload"
          dpkg-deb -x "dist/infiltrator-filesystem-exfat_${version}_amd64.deb" "$RUNNER_TEMP/portable-payload"
          cmp "$RUNNER_TEMP/portable-payload/System/Resources/Documentation/Filesystem-exFAT.pdf" "$RUNNER_TEMP/native-payload/System/Resources/Documentation/Filesystem-exFAT.pdf"
          nm -D --defined-only "$RUNNER_TEMP/native-payload/System/Filesystems/exFAT.so" | grep -F 'infiltrator_filesystem_api_v2'
          ! nm -D --defined-only "$RUNNER_TEMP/native-payload/System/Filesystems/exFAT.so" | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
      - name: Preserve byte-identical independently tested SO and DEB
        uses: actions/upload-artifact@v4
        with:
          name: exfat-so-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  original-exfat-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact independent exFAT repository source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install kernel, QEMU and independent exFAT media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev \
            qemu-system-x86 busybox-static cpio exfatprogs

      - name: Build Linux 6.12 with exFAT modular, never built into vmlinux
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v6.12.107 \
            https://github.com/gregkh/linux.git /tmp/linux-exfat
          make -C /tmp/linux-exfat defconfig
          /tmp/linux-exfat/scripts/config --file /tmp/linux-exfat/.config \
            --module EXFAT_FS \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VIRTIO \
            --enable VIRTIO_PCI \
            --enable VIRTIO_BLK \
            --enable SERIAL_8250 \
            --enable SERIAL_8250_CONSOLE \
            --enable TMPFS
          make -C /tmp/linux-exfat olddefconfig
          grep -Fxq 'CONFIG_EXFAT_FS=m' /tmp/linux-exfat/.config
          grep -Eq '^CONFIG_EXFAT_DEFAULT_IOCHARSET="[^"]+"' \
            /tmp/linux-exfat/.config
          make -C /tmp/linux-exfat -j"$(nproc)" bzImage modules
          test -s /tmp/linux-exfat/Module.symvers

      - name: Link the imported source into its own exfat.ko
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-exfat \
            M="$PWD/native/filesystems/exfat/linux" \
            CONFIG_EXFAT_FS=m modules
          test -s native/filesystems/exfat/linux/exfat.ko
          test "$(modinfo -F name native/filesystems/exfat/linux/exfat.ko)" = exfat
          test -s /tmp/linux-exfat/arch/x86/boot/bzImage

      - name: Format disposable exFAT media using the independent formatter
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 128M /tmp/exfat-qualification.img
          mkfs.exfat -n FSQUAL /tmp/exfat-qualification.img
          fsck.exfat -n /tmp/exfat-qualification.img

      - name: Package only our imported original exfat.ko in initramfs
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/exfat-qualification-root
          mkdir -p "$root"/{bin,proc,sys,dev,mnt/exfat}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir cat echo dd mv sync poweroff stat test grep ls; do
            ln -s busybox "$root/bin/$app"
          done
          cp native/filesystems/exfat/linux/exfat.ko "$root/exfat.ko"
          cat > "$root/init" <<'EOF'
          #!/bin/sh
          set -eu
          fail() {
            echo "EXFAT-RUNTIME-FAIL: $*" > /dev/ttyS0
            poweroff -f
            exit 1
          }
          mount -t proc proc /proc || fail proc
          mount -t sysfs sysfs /sys || fail sysfs
          mount -t devtmpfs devtmpfs /dev || fail devtmpfs
          insmod /exfat.ko || fail "load original exfat.ko"
          grep -q '[[:space:]]exfat$' /proc/filesystems ||
            fail "native exFAT registration"
          mount -t exfat /dev/vda /mnt/exfat || fail "mount exFAT"
          mkdir /mnt/exfat/tree || fail mkdir
          echo "original exfat.ko survives remount" > /mnt/exfat/tree/payload.txt ||
            fail "write payload"
          dd if=/dev/zero of=/mnt/exfat/tree/blocks.bin bs=4096 count=32 ||
            fail "write multi-cluster file"
          mv /mnt/exfat/tree/payload.txt /mnt/exfat/tree/renamed.txt ||
            fail rename
          sync
          umount /mnt/exfat || fail unmount
          mount -t exfat /dev/vda /mnt/exfat || fail remount
          test "$(cat /mnt/exfat/tree/renamed.txt)" = \
            "original exfat.ko survives remount" || fail "persistent contents"
          test "$(stat -c %s /mnt/exfat/tree/blocks.bin)" = 131072 ||
            fail "persistent multi-cluster file size"
          umount /mnt/exfat || fail "final unmount"
          echo "EXFAT-RUNTIME-PASS" > /dev/ttyS0
          poweroff -f
          EOF
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) \
            > /tmp/exfat-qualification.cpio.gz

      - name: Boot independently owned module, verify persistence and offline integrity
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 qemu-system-x86_64 \
            -machine accel=tcg -m 768 -nographic -no-reboot \
            -kernel /tmp/linux-exfat/arch/x86/boot/bzImage \
            -initrd /tmp/exfat-qualification.cpio.gz \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive file=/tmp/exfat-qualification.img,format=raw,if=virtio \
            2>&1 | tee /tmp/exfat-qualification.log
          grep -Fq 'EXFAT-RUNTIME-PASS' /tmp/exfat-qualification.log
          ! grep -Fq 'EXFAT-RUNTIME-FAIL' /tmp/exfat-qualification.log
          fsck.exfat -n /tmp/exfat-qualification.img

      - name: Preserve the exact QEMU-tested exfat.ko
        uses: actions/upload-artifact@v4
        with:
          name: exfat-ko-${{ github.sha }}
          path: native/filesystems/exfat/linux/exfat.ko
          if-no-files-found: error
          retention-days: 14

  manual-package:
    needs: exfat-so
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exfat-so-${{ github.sha }}
          path: dist
      - name: Prepare the pinned Linux build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev bc bison flex libelf-dev kmod dosfstools mtools exfatprogs
          curl --fail --location --retry 5 https://codeload.github.com/gregkh/linux/tar.gz/f717995cb7dcd8998ab15516b8006aea09cfde0d -o "$RUNNER_TEMP/linux.tar.gz"
          mkdir -p "$RUNNER_TEMP/linux"
          tar -xzf "$RUNNER_TEMP/linux.tar.gz" -C "$RUNNER_TEMP/linux" --strip-components=1
          kernel="$RUNNER_TEMP/linux"
          make -C "$kernel" defconfig
          "$kernel/scripts/config" --file "$kernel/.config" --enable MODULES --disable WERROR --disable DEBUG_INFO --module EXFAT_FS
          make -C "$kernel" olddefconfig
          make -C "$kernel" -j2 bzImage modules
          test -s "$kernel/Module.symvers"
          test "$(make -s -C "$kernel" kernelrelease)" = 6.12.107
      - name: Compile all three files through the manual RUN
        shell: bash
        run: |
          set -euo pipefail
          bash dist/*.run --profile portable --kernel-build "$RUNNER_TEMP/linux" --build-only --output "$RUNNER_TEMP/manual"
          python3 standalone/check-package.py "$RUNNER_TEMP"/manual/*.deb --profile portable --kernel-release 6.12.107
          dpkg-deb -x "$RUNNER_TEMP"/manual/*.deb "$RUNNER_TEMP/manual-root"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable-root"
          repository=$(python3 -c 'import sys; sys.path.insert(0,"standalone"); import build; print(build.REPO)')
          identifier=$(printf '%s' "$repository" | sed 's/^Filesystem-//' | tr '[:upper:]' '[:lower:]')
          manual=$(python3 -c 'import sys; sys.path.insert(0,"standalone"); import build; print(build.PDF.name)')
          cmp "$RUNNER_TEMP/manual-root/System/Resources/Documentation/$repository.pdf" "$RUNNER_TEMP/portable-root/System/Resources/Documentation/$repository.pdf"
          mkdir -p build/qualified
          install -m 0644 "$RUNNER_TEMP/manual-root/System/Kernel/Filesystems/$identifier.ko" "build/qualified/$identifier-linux-6.12.107.ko"
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          python3 standalone/release.py bundle-kernel "$package" "build/qualified/$identifier-linux-6.12.107.ko" "build/qualified/$(basename "$package")"
          python3 standalone/check-package.py build/qualified/*.deb --profile portable --kernel-release 6.12.107
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-kernel-package
          path: build/qualified/*
          if-no-files-found: error

  publish:
    name: Publish exact separately qualified SO and KO
    runs-on: ubuntu-24.04
    needs: [exfat-so, original-exfat-qemu, manual-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@v4
        with:
          name: exfat-so-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: exfat-ko-${{ github.sha }}
          path: ko-qualified
      - name: Check exact artifacts and publish release only once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          test -s dist/exFAT.so
          test -s "dist/filesystem-exfat-${version}-native-installer.run"
          test -s "dist/infiltrator-filesystem-exfat_${version}_amd64.deb"
          test -s ko-qualified/exfat.ko
          mkdir -p build/bundled
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          python3 standalone/release.py bundle-kernel "$package" ko-qualified/exfat.ko "build/bundled/$(basename "$package")"
          python3 standalone/check-package.py build/bundled/*.deb --profile portable --kernel-release 6.12.107
          install -m 0644 build/bundled/*.deb dist/
          mv ko-qualified/exfat.ko "dist/exfat-linux-6.12.107.ko"
          (cd dist && sha256sum exFAT.so *.deb *.run *.ko > SHA256SUMS)
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Already published $tag; immutable release will not be overwritten"
            exit 0
          fi
          gh release create "$tag" dist/exFAT.so dist/*.deb dist/*.run dist/*.ko dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Filesystem exFAT $version" \
            --notes "Full exFAT.so V3/V4/V5 read/write/format, independently checked using exfatprogs. Separately built original exfat-linux-6.12.107.ko passed real QEMU Linux 6.12.107 mount, write, rename, remount and fsck qualification. The Debian package includes the shared object, generated manual and QEMU-tested kernel module; system runtime libraries remain Debian dependencies. KO is a pinned-kernel transitional artifact, not a universal kernel SO bridge. No physical drives or firmware settings were modified."

          if nm -D --defined-only "$packaged" | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v1'; then
            echo "::error::Portable exFAT package contains retired public V1 filesystem ABI" >&2
            exit 1
          fi
          # Ensure both release channels ship the same current V2 provider.
          cmp "$packaged" dist/exFAT.so
      - name: Build, profile-train and verify portable native RUN (two-file payload)
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          # Python release.py already generated the source-embedded RUN above.
          bash "dist/filesystem-exfat-${version}-native-installer.run" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native-exfat"
          deb="$RUNNER_TEMP/native-exfat/infiltrator-filesystem-exfat_${version}+native1_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$deb" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$deb" X-Infiltrator-LTO)" = enabled
          test "$(dpkg-deb -f "$deb" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/native-payload"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/native-payload"
          test "$(find "$RUNNER_TEMP/native-payload" -type f | wc -l)" -eq 2
          test -s "$RUNNER_TEMP/native-payload/System/Filesystems/exFAT.so"
          # The tracked docs/exFAT.pdf is a legacy snapshot; compare the two
          # freshly generated PDFs from the same release source instead.
          mkdir -p "$RUNNER_TEMP/portable-payload"
          dpkg-deb -x "dist/infiltrator-filesystem-exfat_${version}_amd64.deb" "$RUNNER_TEMP/portable-payload"
          cmp "$RUNNER_TEMP/portable-payload/System/Resources/Documentation/Filesystem-exFAT.pdf" "$RUNNER_TEMP/native-payload/System/Resources/Documentation/Filesystem-exFAT.pdf"
          nm -D --defined-only "$RUNNER_TEMP/native-payload/System/Filesystems/exFAT.so" | grep -F 'infiltrator_filesystem_api_v2'
          ! nm -D --defined-only "$RUNNER_TEMP/native-payload/System/Filesystems/exFAT.so" | grep -E 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[345]'
      - name: Preserve byte-identical independently tested SO and DEB
        uses: actions/upload-artifact@v4
        with:
          name: exfat-so-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

